# Enable ONLY for initial HTTP-01 issuance; replace by the TLS site afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name staging.hamidian.shop admin.staging.hamidian.shop media.staging.hamidian.shop;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hamidian-silver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
