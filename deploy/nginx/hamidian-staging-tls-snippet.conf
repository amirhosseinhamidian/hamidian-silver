# Dedicated staging certificate. Do not edit production's certificate snippet.
ssl_certificate /etc/letsencrypt/live/staging.hamidian.shop/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/staging.hamidian.shop/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cache-Control "no-store" always;
