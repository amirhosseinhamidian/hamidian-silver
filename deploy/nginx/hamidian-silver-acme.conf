# VPS-004: public certificate bootstrap. Install alongside the VPS-003 loopback site.
# Do not proxy applications over plaintext while waiting for the first certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name hamidian.shop www.hamidian.shop admin.hamidian.shop api.hamidian.shop media.hamidian.shop;
    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hamidian-silver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
