# VPS-004: replace the VPS-003 loopback site only after issuing the first certificate.
# This file is included in nginx's http {} context, not at the top level.
# The challenge webroot must remain available for Certbot's automatic renewal.

# Exclude query strings (including payment callback references) from access logs.
log_format hamidian_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $msec';
error_log /var/log/nginx/hamidian-silver-error.log warn;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name hamidian.shop www.hamidian.shop admin.hamidian.shop api.hamidian.shop media.hamidian.shop;
    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hamidian-silver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# Unknown TLS names must not fall through to the shop or admin site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hamidian.shop;
    include /etc/nginx/snippets/hamidian-silver-tls.conf;
    access_log off;
    server_tokens off;
    return 308 https://hamidian.shop$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamidian.shop;
    include /etc/nginx/snippets/hamidian-silver-tls.conf;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 1m;

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3101;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.hamidian.shop;
    include /etc/nginx/snippets/hamidian-silver-tls.conf;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    # The admin accepts a 10 MiB image plus multipart metadata.
    client_max_body_size 11m;

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3102;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.hamidian.shop;
    include /etc/nginx/snippets/hamidian-silver-tls.conf;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 11m;

    location /api/ {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
    }

    # Keep the API's /docs endpoint private.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.hamidian.shop;
    include /etc/nginx/snippets/hamidian-silver-tls.conf;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 1m;

    location ^~ /media/ {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        # A proxy_pass without a URI preserves the full /media/ path.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3100;
    }

    location / {
        return 404;
    }
}
