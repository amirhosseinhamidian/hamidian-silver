# Installed as /etc/nginx/snippets/hamidian-silver-proxy.conf.
# Trust only the client directly connected to Nginx; do not propagate a supplied
# X-Forwarded-For from an arbitrary caller. Revisit if a trusted CDN is added.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
