# Install at /etc/nginx/snippets/hamidian-silver-tls.conf after issuing the certificate.
ssl_certificate /etc/letsencrypt/live/hamidian.shop/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/hamidian.shop/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;

# Start with a short HSTS lifetime. Extend it only after verifying all subdomains.
# Do not use includeSubDomains or preload at this stage.
add_header Strict-Transport-Security "max-age=300" always;

# Low-risk browser hardening shared by storefront/admin/API/media.
# Keep CSP resource directives separate until third-party/inline script behavior is
# measured; frame-ancestors alone does not interfere with GA4 or payment redirects.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self';" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
