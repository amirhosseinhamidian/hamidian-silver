# Install at /etc/nginx/snippets/hamidian-silver-tls.conf after issuing the certificate.
ssl_certificate /etc/letsencrypt/live/hamidian.shop/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/hamidian.shop/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;

# Start with a short HSTS lifetime. Extend it only after verifying all subdomains.
# Do not use includeSubDomains or preload at this stage.
add_header Strict-Transport-Security "max-age=300" always;
