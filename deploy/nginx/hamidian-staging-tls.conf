# Enable only after the staging certificate is present and nginx -t succeeds.
# No public staging API host: API stays on Docker network / 127.0.0.1:3200.
server {
    listen 80;
    listen [::]:80;
    server_name staging.hamidian.shop admin.staging.hamidian.shop media.staging.hamidian.shop;
    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hamidian-silver-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.hamidian.shop;
    include /etc/nginx/snippets/hamidian-staging-tls.conf;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    auth_basic "Hamidian restricted staging";
    auth_basic_user_file /etc/nginx/hamidian-staging.htpasswd;

    # Public only for provider redirect/POST. The BFF validates attemptId and
    # verifies payment upstream; every other storefront path needs Basic Auth.
    location ~ "^/api/payment/callback/[0-9a-fA-F-]{36}(?:/(?:zibal|mellat))?$" {
        auth_basic off;
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3201;
    }

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3201;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.staging.hamidian.shop;
    include /etc/nginx/snippets/hamidian-staging-tls.conf;
    access_log off;
    server_tokens off;
    client_max_body_size 11m;
    auth_basic "Hamidian restricted staging";
    auth_basic_user_file /etc/nginx/hamidian-staging.htpasswd;

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3202;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.staging.hamidian.shop;
    include /etc/nginx/snippets/hamidian-staging-tls.conf;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    # Public GET is necessary for server-side next/image fetches; stage only
    # non-sensitive test assets. Nothing else on the staging API is exposed.
    location ^~ /media/ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3200;
    }
    location / { return 404; }
}
