# VPS-003: localhost-only routing. VPS-004 must add public TLS and HTTP -> HTTPS.
# This file is installed into sites-available and included by nginx.conf inside http {}.
# Do not move it to the top-level nginx.conf context: log_format requires http {}.

# Never write callback query strings (gateway references) into access logs.
log_format hamidian_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $msec';
error_log /var/log/nginx/hamidian-silver-error.log warn;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    server_name hamidian.shop www.hamidian.shop;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 1m;

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3101;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name admin.hamidian.shop;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    # The admin accepts a 10 MiB image plus multipart metadata.
    client_max_body_size 11m;

    location / {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3102;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name api.hamidian.shop;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 11m;

    location /api/ {
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
    }

    # The API also has a /docs endpoint; do not expose it from this vhost.
    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name media.hamidian.shop;
    server_tokens off;
    access_log /var/log/nginx/hamidian-silver-access.log hamidian_access;
    client_max_body_size 1m;

    location ^~ /media/ {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/snippets/hamidian-silver-proxy.conf;
        # Without a URI suffix, proxy_pass preserves the complete /media/ path.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3100;
    }

    location / {
        return 404;
    }
}
